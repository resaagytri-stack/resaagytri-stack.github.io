<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistik Penduduk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="statistik-page">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Desa Gunungjati</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="profil.html">Profil Desa</a></li>
          <li class="nav-item"><a class="nav-link" href="organisasi.html">Organisasi</a></li>
          <li class="nav-item"><a class="nav-link" href="statistik.html">Statistik</a></li>
          <li class="nav-item"><a class="nav-link" href="umkm.html">UMKM</a></li>
          <li class="nav-item"><a class="nav-link" href="galeri.html">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ISI -->
  <div class="container py-5">
    <h1 class="section-title">Statistik Penduduk Desa</h1>

    <div class="row">
      <div class="col-md-4">
        <div class="card p-3 shadow">
          <h4 class="text-center">Statistik Usia</h4>
          <canvas id="usiaChart"></canvas>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow">
          <h4 class="text-center">Statistik Pendidikan</h4>
          <canvas id="pendidikanChart"></canvas>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow">
          <h4 class="text-center">Statistik Pekerjaan</h4>
          <canvas id="pekerjaanChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Website Desa Gunungjati</p>
  </footer>

  <script>
    // Chart Usia
    new Chart(document.getElementById('usiaChart'), {
      type: 'pie',
      data: {
        labels: ['Anak', 'Remaja', 'Dewasa', 'Lansia'],
        datasets: [{
          data: [450, 498, 1234, 124],
          backgroundColor: ['#f8c8d8', '#c8e6c9', '#f9e3a8', '#d8d1ff']
        }]
      }
    });

    // Chart Pendidikan
    new Chart(document.getElementById('pendidikanChart'), {
      type: 'bar',
      data: {
        labels: ['SD', 'SMP', 'SMA', 'Kuliah'],
        datasets: [{
          label: 'Jumlah',
          data: [1346, 555, 332, 58],
          backgroundColor: '#b7d7a8'
        }]
      }
    });

    // Chart Pekerjaan
    new Chart(document.getElementById('pekerjaanChart'), {
      type: 'doughnut',
      data: {
        labels: ['Petani', 'Pedagang', 'Guru', 'Wiraswasta'],
        datasets: [{
          data: [567, 16, 15, 192],
          backgroundColor: ['#f8c8d8', '#c8e6c9', '#f9e3a8', '#d8d1ff']
        }]
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
